<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="calculadora" aria-label="Calculadora">
    <div class="visor">
      <div class="historico" id="historico"></div>
      <output class="resultado" id="resultado">0</output>
    </div>

    <div class="teclas">
      <button class="tecla limpar" data-acao="limpar">C</button>
      <button class="tecla apagar" data-acao="apagar" aria-label="Apagar">⌫</button>
      <button class="tecla fatorial" data-valor="!">!</button>
      <button class="tecla operador" data-valor="/">/</button>

      <button class="tecla" data-valor="7">7</button>
      <button class="tecla" data-valor="8">8</button>
      <button class="tecla" data-valor="9">9</button>
      <button class="tecla operador" data-valor="*">*</button>

      <button class="tecla" data-valor="4">4</button>
      <button class="tecla" data-valor="5">5</button>
      <button class="tecla" data-valor="6">6</button>
      <button class="tecla operador" data-valor="-">-</button>

      <button class="tecla" data-valor="1">1</button>
      <button class="tecla" data-valor="2">2</button>
      <button class="tecla" data-valor="3">3</button>
      <button class="tecla operador" data-valor="+">+</button>

      <button class="tecla zero" data-valor="0">0</button>
      <button class="tecla igual" data-acao="igual">=</button>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
